name: Build and Push to Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NAMED_APK="SpeedIndicator-${GITHUB_SHA::7}.apk"
          test -f "$APK"
          mv "$APK" "$NAMED_APK"
          echo "APK_PATH=$NAMED_APK" >> "$GITHUB_ENV"
      - name: Check APK size
        id: apk_size
        run: |
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "large=true" >> "$GITHUB_OUTPUT"
          else
            echo "large=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send APK to Telegram
        if: ${{ steps.apk_size.outputs.large != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=Speed Indicator debug APK - ${GITHUB_SHA::7}"
      - name: Install Telethon
        if: ${{ steps.apk_size.outputs.large == 'true' }}
        run: python3 -m pip install --disable-pip-version-check telethon
      - name: Send large APK to Telegram with Telethon
        if: ${{ steps.apk_size.outputs.large == 'true' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import asyncio
          import os
          from telethon import TelegramClient

          async def main():
              api_id = int(os.environ["TELEGRAM_API_ID"])
              api_hash = os.environ["TELEGRAM_API_HASH"]
              bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = int(os.environ["TELEGRAM_CHAT_ID"])
              apk_path = os.environ["APK_PATH"]
              caption = f"Speed Indicator debug APK - {os.environ['GITHUB_SHA'][:7]}"

              client = TelegramClient("speedindicator-ci", api_id, api_hash)
              await client.start(bot_token=bot_token)
              try:
                  await client.send_file(
                      chat_id,
                      apk_path,
                      caption=caption,
                      force_document=True,
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
