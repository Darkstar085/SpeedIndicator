name: SpeedIndicator Debug

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedindicator-debug-build
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      DEBUG_RELEASE_TAG: test-build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: speedindicator-debug-keystore-v1

      - name: Prepare stable debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/speedindicator-debug.keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" "$ANDROID_DEBUG_KEYSTORE"

      - name: Compile androidTest sources
        run: |
          chmod +x ./gradlew
          ./gradlew compileDebugAndroidTestKotlin --stacktrace

      - name: Build debug APK
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/speedindicator-debug.keystore
        run: ./gradlew assembleDebug --stacktrace

      - name: Package debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          APK_NAME="SpeedIndicator-$short_sha.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          test -s "$APK_NAME"

      - name: Verify APK signature
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$APK_NAME"

      - name: Publish or replace debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$DEBUG_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating the existing debug release."
            gh release upload "$DEBUG_RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating the debug release for the first build."
            gh release create "$DEBUG_RELEASE_TAG" "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SpeedIndicator Debug Build" \
              --notes "Latest debug APK for testing. Only the latest APK is kept in this release." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release edit "$DEBUG_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "SpeedIndicator Debug Build" \
            --notes "Latest debug APK for testing. Only the latest APK is kept in this release."

          gh release view "$DEBUG_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ "$asset" == *.apk && "$asset" != "$APK_NAME" ]]; then
                echo "Removing old debug APK: $asset"
                gh release delete-asset "$DEBUG_RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
